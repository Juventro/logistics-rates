name: Check pipeline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start database and pipeline
        run: |
          docker compose up --build -d
          status=$(docker wait "$(docker compose ps -aq pipeline)")
          docker compose logs pipeline
          test "$status" = "0"
      - name: Unit and PostgreSQL integration tests
        run: |
          docker compose exec -T db createdb -U postgres deals_bigdata_test
          docker compose run --rm -e TEST_DATABASE_URL=postgresql://postgres:local_demo_only@db:5432/deals_bigdata_test pipeline python -m pytest -q
      - name: Verify full and partial reruns
        run: docker compose run --rm pipeline python -m tests.check_repeatability
      - name: Export results
        if: always()
        run: |
          docker compose logs --no-color > compose.log
          docker compose cp pipeline:/app/artifacts ./run-artifacts || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-results
          path: |
            compose.log
            run-artifacts
      - name: Stop services
        if: always()
        run: docker compose down -v
