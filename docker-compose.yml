services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/${POSTGRES_DB:-deals_bigdata}
      AS_OF: ${AS_OF:-2026-10-26}
      N_PRICES: ${N_PRICES:-300000}
      MODEL_ITERATIONS: ${MODEL_ITERATIONS:-300}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      ARTIFACT_DIR: /app/artifacts
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/artifacts

volumes:
  postgres_data:
  model_artifacts:
